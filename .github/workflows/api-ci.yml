name: api-ci

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  build-and-unit:
    name: contracts + API build + unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          cache-dependency-path: services/ai/pyproject.toml
      - name: Install workspace dependencies
        run: npm ci
      - name: Check shared contracts
        run: npm run check -w @marketmind/contracts
      - name: Build API
        run: npm run build -w @marketmind/api
      - name: Run API unit tests
        run: npm run test -w @marketmind/api -- --runInBand

  integration:
    name: API migrations + E2E + database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketmind
          POSTGRES_PASSWORD: marketmind_ci
          POSTGRES_DB: marketmind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketmind -d marketmind_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://marketmind:marketmind_ci@localhost:5432/marketmind_ci?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Build shared contracts
        run: npm run build -w @marketmind/contracts
      - name: Generate Prisma client
        run: npm run prisma:generate -w @marketmind/api
      - name: Apply database migrations
        run: npm run prisma:deploy
      - name: Run API E2E tests
        run: npm run test:e2e -w @marketmind/api
      - name: Run database integration tests
        run: npm run test:db -w @marketmind/api
